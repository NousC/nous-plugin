# Nous — weekly coaching. Installed by the `automate` skill; do not edit by hand. Every Sunday it
# runs the plugin headlessly on YOUR tokens to write a coaching report over the week's calls, then
# commits it back to this repo. Requires NOUS_API_KEY plus ONE Claude credential:
# CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`, subscription — no API credits) OR ANTHROPIC_API_KEY.
name: Nous — weekly coaching

on:
  schedule:
    - cron: "0 15 * * 0"   # Sundays 15:00 UTC (edit to your morning)
  workflow_dispatch: {}

concurrency:
  group: nous-weekly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run the weekly coaching routine
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOUS_API_KEY: ${{ secrets.NOUS_API_KEY }}
        run: |
          MCP_CONFIG="$RUNNER_TEMP/nous-mcp.json"
          jq -n --arg key "$NOUS_API_KEY" \
            '{mcpServers:{opennous:{command:"npx",args:["-y","@opennous/mcp"],env:{NOUS_SURFACE:"plugin",NOUS_API_KEY:$key}}}}' \
            > "$MCP_CONFIG"
          trap 'rm -f "$MCP_CONFIG"' EXIT
          # Prompt on stdin (--mcp-config is variadic) + allowlist the MCP tools (acceptEdits is files only).
          printf '%s' "Follow the routine in .nous/skills/weekly-coaching.md exactly: write this week's coaching report from the scored calls into coaching/weekly/, and stop." \
            | claude --print \
                --permission-mode acceptEdits \
                --allowedTools "mcp__opennous,Read,Write,Edit,Bash,Glob,Grep" \
                --mcp-config "$MCP_CONFIG"

      - name: Commit the weekly report
        run: |
          git config user.name  "nous-bot"
          git config user.email "bot@opennous.cloud"
          git add coaching/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "weekly-coaching: report for the week"
            git push
          fi
