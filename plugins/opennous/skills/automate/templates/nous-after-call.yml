# Nous — after every call. Installed by the `automate` skill; do not edit by hand (re-run
# /opennous:automate to update). When a call ends, Nous fires a repository_dispatch and this runs
# the plugin headlessly on YOUR tokens to draft the follow-up + coach the call, then commits the
# results back to this repo. Requires NOUS_API_KEY plus ONE Claude credential:
# CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`, uses your Claude subscription — no API credits)
# OR ANTHROPIC_API_KEY (API billing, needs credits). Set whichever you have.
name: Nous — after call

on:
  repository_dispatch:
    types: [nous.meeting_held]
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

concurrency:
  # One run per account at a time; don't cancel an in-flight review.
  group: nous-after-call-${{ github.event.client_payload.entity_id || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write         # commit the drafts + coaching notes back

jobs:
  after-call:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run the after-call routine
        env:
          # Set EITHER of these — the OAuth token (subscription) is used when present, else the API key.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOUS_API_KEY: ${{ secrets.NOUS_API_KEY }}
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          claude --print \
            --permission-mode acceptEdits \
            --mcp-config "{\"mcpServers\":{\"opennous\":{\"command\":\"npx\",\"args\":[\"-y\",\"@opennous/mcp\"],\"env\":{\"NOUS_SURFACE\":\"plugin\",\"NOUS_API_KEY\":\"$NOUS_API_KEY\"}}}}" \
            "A call just ended. Follow the routine in .nous/skills/after-call.md exactly. The dispatch payload (workspace_id, entity_id, occurred_at, source) is: $CLIENT_PAYLOAD. Read the scored call from get_account, write the coaching review and the follow-up draft into this repo, and stop. Do not send anything."

      - name: Commit the follow-up + coaching
        run: |
          git config user.name  "nous-bot"
          git config user.email "bot@opennous.cloud"
          git add drafts/ coaching/ raw/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "after-call: follow-up + coaching (${{ github.event.client_payload.entity_id || 'manual' }})"
            git push
          fi
